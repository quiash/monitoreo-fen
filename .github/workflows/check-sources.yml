name: Diagnosticar fuentes oficiales
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/check-sources.yml']
permissions:
  contents: read
jobs:
  comprobar:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04-arm, windows-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 4
    steps:
      - name: Comprobar respuestas desde GitHub
        shell: bash
        run: |
          python - <<'PY'
          import concurrent.futures, json, socket, subprocess, os
          jobs = {
            'INDECI SINPAD': ['https://geosinpad.indeci.gob.pe/indeci/rest/services/Emergencias/EMERGENCIAS_SINPAD/MapServer/0/query?where=1%3D1&outFields=FECHA,IDE_SINPAD&orderByFields=FECHA+DESC&resultRecordCount=1&f=json'],
            'SENAMHI página': ['https://www.senamhi.gob.pe/mapas/mapa-monitoreo-meteo/monitoreo-precipitacion.php'],
            'SENAMHI hidrograma': ['https://www.senamhi.gob.pe/mapas/mapa-monitoreohidro/include/mnt-grafica-new.php','--data','id=105136&fecha_hora=2026-11-11+23%3A59%3A00&rbtVariable=NIVEL&variable_opcion=N&btnTipo=D'],
            'SENAMHI WFS pequeño': ['https://idesep.senamhi.gob.pe/geoserver/monitoreo_meteorologico/ows?service=WFS&version=1.0.0&request=GetFeature&typeName=monitoreo_meteorologico%3Aprec_1_all_points&maxFeatures=1&outputFormat=application%2Fjson'],
            'SENAMHI WCS reducido': ['https://idesep.senamhi.gob.pe/geoserver/monitoreo_meteorologico/wcs?service=WCS&version=2.0.1&request=GetCoverage&coverageId=monitoreo_meteorologico__prec_1&format=image%2Ftiff&scaleFactor=0.25']
          }
          for host in ['coen.indeci.gob.pe','www.senamhi.gob.pe','idesep.senamhi.gob.pe']:
            try: print(host, socket.getaddrinfo(host,443,type=socket.SOCK_STREAM),flush=True)
            except Exception as error: print(host,str(error),flush=True)
          def run(item):
            name,params=item
            result=subprocess.run(['curl','-4','-L','--silent','--show-error','--connect-timeout','8','--max-time','22','-A','MonitoreoFEN/1.0 (+https://github.com/quiash/monitoreo-fen)','-o',os.devnull,'-w','HTTP %{http_code}; bytes %{size_download}; segundos %{time_total}',*params],capture_output=True,text=True)
            return {'source':name,'exit':result.returncode,'result':result.stdout,'error':result.stderr}
          with concurrent.futures.ThreadPoolExecutor(max_workers=5) as pool:
            for result in pool.map(run,jobs.items()):print(json.dumps(result,ensure_ascii=False),flush=True)
          PY
