name: Actualizar datos FEN
on:
  schedule:
    - cron: '23 */3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-data.yml'
      - 'tools/refresh_data.py'
      - 'tools/request_pages_build.py'
      - 'tools/requirements-refresh.txt'
permissions:
  contents: write
  pages: write
concurrency:
  group: fen-data-refresh
  cancel-in-progress: false
jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements-refresh.txt
      - name: Instalar dependencias
        run: python -m pip install -r tools/requirements-refresh.txt
      - name: Verificar actualización e integridad
        run: |
          python -m unittest discover -s tests -v
          python tools/validate_site.py
      - name: Consultar fuentes oficiales
        run: python tools/refresh_data.py
      - name: Comprobar resultado
        run: python tools/validate_live.py
      - name: Guardar datos y estado
        id: guardar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/live.json data/status.json
          if ! git diff --cached --quiet; then
            git commit -m 'Actualizar fuentes FEN y estado de consulta'
            git push origin HEAD:main
          fi
      - name: Publicar en GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python tools/request_pages_build.py
