name: Actualizar datos FEN
on:
  schedule:
    - cron: '23 */3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-data.yml'
      - 'tools/refresh_data.py'
      - 'tools/request_pages_build.py'
      - 'tools/publish_updates.sh'
      - 'tools/requirements-refresh.txt'
permissions:
  contents: write
  pages: write
concurrency:
  group: fen-data-refresh
  cancel-in-progress: true
jobs:
  actualizar:
    # Optional runner labels as JSON, e.g. ["self-hosted","Linux","fen"].
    runs-on: ${{ fromJSON(vars.FEN_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements-refresh.txt
      - name: Instalar dependencias
        run: python -m pip install -r tools/requirements-refresh.txt
      - name: Verificar actualización e integridad
        run: |
          python -m unittest discover -s tests -v
          python tools/validate_site.py
      - name: Consultar COEN
        timeout-minutes: 3
        continue-on-error: true
        run: python tools/refresh_data.py --only coen
      - name: Publicar estado COEN
        run: bash tools/publish_updates.sh
      - name: Consultar ANA
        timeout-minutes: 5
        continue-on-error: true
        run: python tools/refresh_data.py --only ana
      - name: Publicar actualización ANA
        run: bash tools/publish_updates.sh
      - name: Consultar lluvia SENAMHI
        timeout-minutes: 6
        continue-on-error: true
        run: python tools/refresh_data.py --only rain
      - name: Publicar actualización de lluvia
        run: bash tools/publish_updates.sh
      - name: Consultar ríos SENAMHI
        timeout-minutes: 13
        continue-on-error: true
        run: python tools/refresh_data.py --only hydro
      - name: Publicar actualización de ríos
        run: bash tools/publish_updates.sh
